"""
Storage used by one album's photos
"""
type AlbumStorage {
  """
  The album's global ID (the Folder ID)
  """
  albumId: ID!

  """
  Bytes of originals in archive storage
  """
  archivedBytes: BigInt!

  """
  Bytes stored for the album, originals and previews
  """
  bytes: BigInt!

  """
  The album's name
  """
  name: String!

  """
  Bytes of original files (RAW and camera HEIF/JPEG)
  """
  originalBytes: BigInt!

  """
  Number of photo takes in the album
  """
  photoCount: Int!

  """
  A tier move in progress, if any
  """
  transition: StorageTransition
}

