type Mutation {
  """
  Moves an album's photo originals to cheaper archive storage; previews stay in standard storage
  """
  archiveAlbum(
    """
    The ID of the album (folder)
    """
    id: ID!
  ): ArchiveAlbumPayload
  attachPhotoPromiseFiles(
    """
    The files to include in the photo promise
    """
    files: [PhotoPromiseFileInput!]!

    """
    The ID of the photo promise to attach files to
    """
    id: ID!
  ): AttachPhotoPromiseFilesPayload

  """
  Creates a new upload photo promise
  """
  createPhotoPromise(
    """
    Album the uploads go into (created if missing)
    """
    albumName: String

    """
    Event and venue supplied by the uploader
    """
    uploadContext: JSON
  ): CreatePhotoPromisePayload

  """
  Deletes photos and their stored files
  """
  deletePhotos(
    """
    The IDs of the photos to delete
    """
    ids: [ID!]!
  ): DeletePhotosPayload

  """
  Moves an album's archived photo originals back to standard storage
  """
  restoreAlbum(
    """
    The ID of the album (folder)
    """
    id: ID!
  ): RestoreAlbumPayload

  """
  Updates a caption_photo by id
  """
  updatePhotoCaption(
    """
    The new caption for the photo
    """
    caption: String!

    """
    The new description for the photo
    """
    description: String!

    """
    The ID of the photo to update
    """
    id: ID!
  ): UpdatePhotoCaptionPayload

  """
  Updates a PhotoTake by id
  """
  updatePhotoFace(
    """
    The new facial recognition data for the photo
    """
    faces: [FaceDataInput!]!

    """
    The ID of the photo to update
    """
    id: ID!
  ): UpdatePhotoFacialRecognitionPayload

  """
  Updates a update_photo_promise_file by id. SUCCESS turns the uploaded file into a photo take.
  """
  updatePhotoPromiseFileUpdate(id: ID!, status: PhotoPromiseFileStatus!): UpdatePhotoPromiseFileUpdatePayload
}

