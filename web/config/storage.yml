test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage/test", Process.pid.to_s) %>

test_archive:
  service: Disk
  root: <%= Rails.root.join("tmp/storage/test_archive", Process.pid.to_s) %>

disk:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: S3
  bucket: <%= ENV['MINIO_BUCKET'] || 'hedonism-bot' %>
  endpoint: <%= ENV['MINIO_ENDPOINT'] || 'http://localhost:9000' %>
  access_key_id: <%= ENV['MINIO_ACCESS_KEY_ID'] || 'minioadmin' %>
  secret_access_key: <%= ENV['MINIO_SECRET_ACCESS_KEY'] || 'minioadmin' %>
  region: us-east-1
  force_path_style: true

# Heroku Bucketeer add-on (sets the BUCKETEER_* config vars). Objects are private; Active Storage
# serves them through signed URLs.
bucketeer:
  service: S3
  bucket: <%= ENV["BUCKETEER_BUCKET_NAME"] %>
  access_key_id: <%= ENV["BUCKETEER_AWS_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["BUCKETEER_AWS_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("BUCKETEER_AWS_REGION", "us-east-1") %>

# Main photo storage billed per GB, enabled by setting HOT_BUCKET_NAME; takes over from Bucketeer.
# Cloudflare R2: HOT_ENDPOINT=https://<account id>.r2.cloudflarestorage.com, region auto (default).
# Browsers upload straight to it, so the bucket needs a CORS rule allowing PUT from the gallery hosts.
hot:
  service: S3
  bucket: <%= ENV["HOT_BUCKET_NAME"] %>
  access_key_id: <%= ENV["HOT_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["HOT_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("HOT_REGION", "auto") %>
<% if ENV["HOT_ENDPOINT"].present? %>
  endpoint: <%= ENV["HOT_ENDPOINT"] %>
<% end %>

# Cheaper storage for photo originals, enabled by setting ARCHIVE_BUCKET_NAME. Any S3-compatible
# bucket billed per GB works: AWS S3 (originals are written with ARCHIVE_STORAGE_CLASS, default
# GLACIER_IR, which still reads instantly), or Backblaze B2 / Cloudflare R2 via ARCHIVE_ENDPOINT
# with ARCHIVE_STORAGE_CLASS set to an empty string.
archive:
  service: S3
  bucket: <%= ENV["ARCHIVE_BUCKET_NAME"] %>
  access_key_id: <%= ENV["ARCHIVE_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["ARCHIVE_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("ARCHIVE_REGION", "us-east-1") %>
<% if ENV["ARCHIVE_ENDPOINT"].present? %>
  endpoint: <%= ENV["ARCHIVE_ENDPOINT"] %>
<% end %>
<% if ENV.fetch("ARCHIVE_STORAGE_CLASS", "GLACIER_IR").present? %>
  upload:
    storage_class: <%= ENV.fetch("ARCHIVE_STORAGE_CLASS", "GLACIER_IR") %>
<% end %>

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to check in your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

