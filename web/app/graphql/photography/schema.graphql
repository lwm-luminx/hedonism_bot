"""
A logical Photo containing takes, as shared with an audience; never a PhotoTake
of the gallery API. With photos(updatedSince:), a photo that was unpublished or
deleted is still listed, as a tombstone (removed: true, no takes, no preview),
so a consumer can drop it without re-crawling.
"""
type PhotographyPhoto {
  """
  The photo's opaque, stable identifier; the same across pages and crawls.
  """
  id: ID!

  """
  A stable HTTPS link to the current preview (redirects to the stored image); null without one.
  """
  previewUrl: String

  """
  When it was shared; the page order.
  """
  publishedAt: ISO8601DateTime!

  """
  The photo is no longer shared with this audience: drop it.
  """
  removed: Boolean!

  """
  Processed takes of the photo; 0 for a tombstone.
  """
  takeCount: Int!

  """
  When it was last shared, changed or removed; feed it back as updatedSince.
  """
  updatedAt: ISO8601DateTime!
}

"""
The connection type for PhotographyPhoto.
"""
type PhotographyPhotoConnection {
  """
  A list of edges.
  """
  edges: [PhotographyPhotoEdge]

  """
  A list of nodes.
  """
  nodes: [PhotographyPhoto]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
}

"""
An edge in a connection.
"""
type PhotographyPhotoEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: PhotographyPhoto
}

type PhotographyQuery {
