# Use this file to configure the Overcommit hooks you wish to use. This will
# extend the default configuration defined in:
# https://github.com/sds/overcommit/blob/master/config/default.yml

PreCommit:
  RuboCop:
    enabled: true
    on_warn: fail
    command: ['sh', '-c', 'cd web && bundle exec rubocop']

  EsLint:
    enabled: true
    command: [ 'bun', '--cwd', 'web', 'run', 'lint', '--', '-f', 'compact' ]

  SteepCheck:
    enabled: true
    description: 'Run Steep static type checker'
    required: true
    execute: [ 'sh', '-c', 'cd web && bundle exec steep check' ]

  Vitest:
    enabled: true
    description: 'Runs Vitest unit tests'
    required: true
    command: [ 'bun', '--cwd', 'web', 'run', 'test:run' ]

PrePush:
  RSpec:
    enabled: true
    command: ['sh', '-c', 'cd web && bundle exec rspec']
