# Heroku now builds with buildpacks on heroku-24 (see Procfile, Aptfile, RustConfig); this file
# only applies if the app is switched back to the container stack.
build:
  docker:
    web: Dockerfile
release:
  image: web
  command:
    - bin/rails heroku:release
run:
  web: bin/rails server -b 0.0.0.0 -p $PORT
