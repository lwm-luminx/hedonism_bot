name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # Link clusterkit against the system OpenBLAS instead of downloading and compiling it from source.
  CLUSTERKIT_FEATURES: openblas-system

jobs:
  scan_ruby:
    runs-on: ubuntu-24.04

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips libopenblas-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-24.04
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips libopenblas-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  frontend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Run Vitest
        run: bun run test:run

  worker:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: who_dis

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: who_dis/uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run --frozen pytest

  test:
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      RAILS_ENV: test
      # libpq reads these, so every database in config/database.yml (primary and queue) connects the same way.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      # Ubuntu 24.04 ships libheif 1.17, which can't decode the rotated 10-bit HEVC fixture
      # (DSC00006.hif); the strukturag PPA provides a current libheif (libde265 comes from Ubuntu).
      - name: Install packages
        run: |
          sudo add-apt-repository -y ppa:strukturag/libheif
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpq-dev libvips libopenblas-dev libimage-exiftool-perl \
            libheif1 libheif-plugin-libde265 \
            postgresql-16-postgis-3 postgresql-16-pgvector
          dpkg -s libheif1 | grep '^Version'

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Photo fixtures in spec/fixtures are stored in Git LFS.
          lfs: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # vite_ruby auto-builds the frontend on first request in the test environment.
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Prepare database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec

  mac:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac/HedonismUploader

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Swift tests
        run: swift test

      - name: Build the app bundle
        run: script/bundle-app.sh
