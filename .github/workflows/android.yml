name: Android

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chip:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Upload core tests
        run: ./gradlew -p core test

      # Runs the app's Robolectric tests and records the Play Store screenshots in store/screenshots.
      - name: App tests and store screenshots
        run: ./gradlew :app:recordRoborazziDebug

      - name: Lint
        run: ./gradlew :app:lintDebug

      # Unsigned here: the Play upload key lives on the release Mac, never in CI.
      - name: Release bundle (R8)
        run: ./gradlew :app:bundleRelease

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: chip-android
          path: |
            android/store/screenshots
            android/app/build/reports
            android/app/build/outputs/bundle/release
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
